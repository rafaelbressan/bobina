# Imported from escpos-printer-db, profile "NBTP-8080" (receipt-print-hq, CC BY 4.0,
# https://github.com/receipt-print-hq/escpos-printer-db). Model facts only: NOT measured on paper.
# Generated by tools/import_profiles.py; edit the generator, not this file. Calibrate with:
#   bobina calibrate tear   and   bobina calibrate feed

id = "netbye-nbtp-8080"
name = "NETBYE NBTP-8080"
source = "escpos-printer-db: NBTP-8080 (CC BY 4.0)"
measured = false
evidence = "not measured on paper: model facts from escpos-printer-db; bobina's safe mode is on"
width_dots = 576          # 72 mm printable
dpi = 203
paper_mm = 80
command_set = "escpos"
encoding = "codepage"     # ⚠ code pages not tested on paper (docs/TESTED.md)
cutter = "partial"          # from the database; ⚠ not tested on paper

[margins]
top_dots = 24
block_gap_dots = 12
tear_dots = 40            # assumed 5 mm: bobina calibrate tear measures it
feed_after_dots = 88      # tear bar + 6 mm to spare

[transport]
chunk_bytes = 4096
pause_s = 0.0
band_rows = 64
print_mm_per_s = 40

[escpos]
blank_rows_after_raster = true  # safe until bobina calibrate feed says ESC J works after images

[native]
cell = [12, 24]           # font A, 48 columns (576 dots / 48, rounded up)
line_gap_dots = 6
emulation_font = "spleen-12x24.otf"   # a 12-dot font: with a wider cell the preview spacing is approximate
scales_ok = [1, 2]
glyph_ranges = [[0x20, 0x7E]]   # without code pages: ASCII native, everything else raster

[native.sizes]
small = [1, 1]
normal = [1, 1]
large = [2, 2]
title = [2, 2]
huge = [2, 2]

[native.headings]
h1 = { scale = [2, 2], bold = true }
h2 = { scale = [1, 2], bold = true }
h3 = { scale = [1, 1], bold = true }

[qr]
native = true            # from the database; raster QR otherwise
default_module = 4
min_module_native = 3
min_module_raster = 4
default_ecc = "M"

[barcode]
native = ["upca", "ean13", "ean8", "code39", "codabar", "code93", "code128"]  # from the database (barcodeB); ⚠ not tested on paper
min_module = 2
default_module = 2
default_height = 80
min_module_feed = 4
quiet_modules = 10

[raster]
min_stroke_dots = 2
min_gap_dots = 2
min_text_px = 12
invert_min_px = 20
invert_margin_dots = 4

[image]
dither = "floyd-steinberg"
gamma = 1.8

[preview]
calibrated = false

[preview.realistic]
spread_px = 0.6
gain = 1.25
ink = [38, 36, 42]
paper = [247, 245, 239]
fade_dots = 0
fade_strength = 0.0
scale = 2

[codepages]               # codec = ESC t number, preferred first
cp437 = 0
