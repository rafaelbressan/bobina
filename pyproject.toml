[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bobina"
version = "0.1.0rc2"
description = "Print Markdown on thermal roll printers, with calibrated defaults, previews you can trust and nudges instead of blocks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "src/bobina/fonts/licenses/*"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Printing",
]
dependencies = [
  "pillow>=10",
  "segno>=1.6",
  "markdown-it-py>=3",
  "mdit-py-plugins>=0.4",
  "jinja2>=3.1",
  "babel>=2.12",
  "pyyaml>=6",
  "fonttools>=4.40",
  "python-barcode>=0.15",
  "ppf-datamatrix>=0.2",
  "pdf417gen>=0.7",
]

[project.optional-dependencies]
pdf = ["pypdfium2>=5.14"]
svg = ["resvg-py>=0.5"]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8", "ruff>=0.6", "pypdfium2>=5.14", "resvg-py>=0.5", "openpyxl>=3.1"]

[project.scripts]
bobina = "bobina.cli:main"
bob = "bobina.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bobina"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]   # explicit try/except/pass reads clearer than contextlib.suppress here

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal documents read better unbroken
