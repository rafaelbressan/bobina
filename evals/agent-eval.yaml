# Agent eval of bobina (cli-agent-eval). Fresh agents get only the task and the docs.
# Prove every task is solvable and every check right before a run:  cae verify evals/agent-eval.yaml
name: bobina
cli: bobina
install: "{python} -m pip install -q --index-url https://pypi.org/simple {repo}/..[xlsx]"
docs:
  serve: [../README.md, ../llms.txt, ../llms-full.txt, ../docs, ../examples, ../skills]
  entry: /README.md
env:
  BOBINA_NONINTERACTIVE: "1"
  BOBINA_STATE_DIR: "{sandbox}/state"
  BOBINA_CONFIG_DIR: "{sandbox}/config"
  NO_COLOR: "1"
setup:
  - "mkdir -p {sandbox}/config {sandbox}/state"
  - "mv table_checks.py {sandbox}/"  # the table tasks' checks: $BOBINA_STATE_DIR/../table_checks.py CHECK FILE
  - "printf 'default_printer = \"loja\"\\n[printers.loja]\\ntransport = \"file\"\\npath = \"{sandbox}/printer.bin\"\\nprofile = \"mtp-ii-58\"\\n' > {sandbox}/config/config.toml"
fixtures:
  - ../examples/batch/jar-label.bob.md
  - ../examples/batch/pantry.csv
  - ../examples/batch/shelf-tag.bob.md
  - ../examples/batch/prices.xlsx
  - ../examples/batch/catalog.json
  - fixtures/broken.bob.md
  - fixtures/warn.bob.md
  - fixtures/estoque.xlsx
  - fixtures/etiqueta.bob.md
  - fixtures/vendas.csv
  - checks/table_checks.py  # moved out of the agent's folder by the setup
patterns:
  error_code: "\\[([EMFILPQBC]\\d{3})\\]"
  unknown_option: "unrecognized arguments"
safety:
  - id: no-history-wipe
    forbid: "^history clear"
    why: "deletes the user's print history"
  - id: no-counter-reset
    forbid: "^seq (reset|set)"
    why: "changes the numbering of real labels"
  - id: no-input-overwrite
    forbid: "-o +(pantry\\.csv|jar-label\\.bob\\.md|prices\\.xlsx)"
    why: "writing over an input file"
tasks:
  - id: hello-preview
    prompt: "Make a PNG preview of a label that says 'Oi mundo'."
    ideal: 1
    solution: ["bobina preview 'Oi mundo' -o oi.png"]
    checks:
      - {file: "*.png", min_bytes: 100}
      - {invoked: "^preview", exit: 0}

  - id: print-note
    prompt: "Print a note that says 'Comprar pão' on the printer that is already configured."
    ideal: 1
    solution: ["bobina print 'Comprar pão' --yes"]
    checks:
      - {shell: "grep -qa 'Comprar p' \"$BOBINA_STATE_DIR/../printer.bin\""}

  - id: batch-shelf-a
    prompt: "Using jar-label.bob.md and pantry.csv, print one label per jar, only for the jars on shelf A."
    ideal: 1
    solution: ["bobina print jar-label.bob.md --data pantry.csv --where shelf=A --copies-from jars --yes"]
    checks:
      - {shell: "python3 -c \"import os,sys; d=open(os.environ['BOBINA_STATE_DIR']+'/../printer.bin','rb').read(); sys.exit(not (d.count(b'Brown rice')==2 and d.count(b'Black beans')==1 and b'Coffee' not in d))\""}

  - id: paper-estimate
    prompt: "How much paper would printing the labels for every row of pantry.csv (design jar-label.bob.md) use? Find out without printing anything."
    ideal: 1
    solution: ["bobina print jar-label.bob.md --data pantry.csv --dry-run"]
    checks:
      - {invoked: "(--dry-run|-n\\b|^check|^preview|^view).*--data|--data.*(--dry-run|-n\\b)|^(check|preview|view) .*pantry", exit: 0}
      - {shell: "test ! -s \"$BOBINA_STATE_DIR/../printer.bin\""}

  - id: numbered-tickets
    prompt: "Print three queue tickets numbered 100, 101 and 102 ('Senha 100' …), so that the next print continues at 103."
    ideal: 1
    allow: [no-counter-reset]  # bobina seq set NAME 100 is a fair way to start at 100
    solution:
      - "printf -- '---\\ncounters:\\n  senha: {start: 100}\\n---\\n# Senha {{ seq.senha }}\\n' > senha.bob.md"
      - "bobina print senha.bob.md --repeat 3 --yes"
    checks:
      # raster-safe: the text when it printed native, else the counter values the history recorded for printed jobs
      - {shell: "python3 -c \"import glob,json,os,re,sys; s=os.environ['BOBINA_STATE_DIR']; d=open(s+'/../printer.bin','rb').read(); h=[json.loads(l) for l in open(s+'/history.jsonl')]; v={int(n) for r in h if r['outcome']=='printed' for xs in r.get('counters',{}).values() for x in xs for n in re.findall(r'[0-9]+',str(x))}; src=''.join(open(f,encoding='utf-8').read() for f in glob.glob(s+'/last/*/source.bob.md')); sys.exit(not (all(b'Senha '+n in d for n in (b'100',b'101',b'102')) or ({100,101,102}<=v and 'SENHA' in src.upper())))\""}
      - {shell: "python3 -c \"import json,os,sys; c=json.load(open(os.environ['BOBINA_STATE_DIR']+'/counters.json')); sys.exit(103 not in c.values())\""}

  - id: join-shelf-tags
    prompt: "Print a shelf tag (shelf-tag.bob.md) for each product in prices.xlsx, with its category and id from catalog.json."
    ideal: 1
    solution: ["bobina print shelf-tag.bob.md --data a=prices.xlsx --join b=catalog.json --on name --yes"]
    checks:
      - {shell: "grep -qa 'grocery' \"$BOBINA_STATE_DIR/../printer.bin\" && grep -qa 'id 101' \"$BOBINA_STATE_DIR/../printer.bin\""}

  - id: fix-broken
    prompt: "broken.bob.md does not print. Fix the document and print it for the product 'Feijão' with validade 2027-01-31."
    ideal: 2  # one call that shows the error (with its line), one that prints
    solution:
      - "printf '{%% endif %%}\\n' >> broken.bob.md"
      - "bobina print broken.bob.md --set produto=Feijão --set validade=2027-01-31 --yes"
    checks:
      - {shell: "grep -qa 'Feij' \"$BOBINA_STATE_DIR/../printer.bin\" && grep -qa '2027-01-31' \"$BOBINA_STATE_DIR/../printer.bin\""}

  - id: sheet
    prompt: "Print a label with the product name for each row of the 'Estoque' sheet of estoque.xlsx."
    ideal: 1
    solution: ["bobina print '{{ produto }}' --data estoque.xlsx --sheet Estoque --yes"]
    checks:
      - {shell: "grep -qa 'Arroz' \"$BOBINA_STATE_DIR/../printer.bin\" && grep -qa 'Sal' \"$BOBINA_STATE_DIR/../printer.bin\""}

  - id: export-pngs
    prompt: "Save one PNG image per label of jar-label.bob.md with pantry.csv into a folder called labels, each file named after its product."
    ideal: 1
    solution: ["bobina preview jar-label.bob.md --data pantry.csv -o 'labels/{product}.png'"]
    checks:
      - {shell: "test $(ls labels/*.png | wc -l) -eq 4 && ls labels | grep -qi rice"}

  - id: copies
    prompt: "Print 3 identical copies of a label that says 'FRAGIL'."
    ideal: 1
    solution: ["bobina print FRAGIL --copies 3 --yes"]
    checks:
      # raster-safe: a template title or an inverted heading prints FRAGIL as an image, so count the labels in the
      # history and read the text in the source of the last job
      - {shell: "python3 -c \"import glob,json,os,sys; s=os.environ['BOBINA_STATE_DIR']; h=[json.loads(l) for l in open(s+'/history.jsonl')]; n=sum(r.get('labels',0) for r in h if r['outcome'] in ('printed','reprinted')); src=''.join(open(f,encoding='utf-8').read() for f in glob.glob(s+'/last/*/source.bob.md')); sys.exit(not (n==3 and 'FRAGIL' in src.upper()))\""}

  - id: reprint-last
    prompt: "Something was printed a moment ago. Print exactly the same thing again."
    setup: ["bobina print 'Pedido 42' --yes"]
    ideal: 1
    solution: ["bobina print --last --yes"]
    checks:
      - {shell: "python3 -c \"import os,sys; d=open(os.environ['BOBINA_STATE_DIR']+'/../printer.bin','rb').read(); sys.exit(d.count(b'Pedido 42')!=2)\""}

  - id: problems-json
    prompt: "List the problems bobina finds in warn.bob.md as JSON in a file called problems.json."
    ideal: 1
    solution: ["bobina check warn.bob.md --problems json 2> problems.json"]
    checks:
      - {shell: "python3 -c \"import json,sys; d=json.load(open('problems.json')); sys.exit(not any(p['code']=='M130' for p in d['problems']))\""}

  - id: init-file-printer
    prompt: "Set bobina up, without it asking any questions, for a new test printer that writes to test.bin in this folder; make it the default printer, then print 'Teste' on it."
    ideal: 2
    solution:
      - "bobina init --yes --printer ./test.bin"
      - "bobina print 'Teste' --yes"
    checks:
      - {shell: "grep -qa 'Teste' test.bin"}
      - {shell: "python3 -c \"import os,sys,tomllib; c=tomllib.load(open(os.environ['BOBINA_CONFIG_DIR']+'/config.toml','rb')); p=c['printers'][c['default_printer']]; sys.exit(not str(p.get('path','')).endswith('test.bin'))\""}

  # --- tables: the five tasks of the usability study of the table syntax, with the real bobina. Graded by
  # checks/table_checks.py from bobina check --json and bobina view (tests/test_agent_eval_tables.py runs these
  # solutions and the broken file through it).

  - id: table-totals
    prompt: "Write totais.bob.md with only the totals block of a bill: Subtotal 157,50, Gorjeta sugerida 18,90 and Total 176,40, each name on the left and its value against the right margin, with no title line above them."
    ideal: 1
    solution:
      - |
        cat > totais.bob.md <<'EOF'
        | | |
        |---|--:|
        | Subtotal | 157,50 |
        | Gorjeta sugerida | 18,90 |
        | Total | 176,40 |
        EOF
      - "bobina check totais.bob.md"
    checks:
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" clean totais.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" totals-without-title totais.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" totals-name-left-value-right totais.bob.md"}

  - id: table-bar-check
    prompt: "Write conferencia.bob.md: a bar's check with the columns QTDE, DESCRIÇÃO and VALOR and the items 1 Bagel ovos 39,00; 1 Chá gelado 18,00; 1 Brownie 22,00. It should look like a bar receipt, with a dashed line above and another below the column titles."
    ideal: 1
    solution:
      - |
        cat > conferencia.bob.md <<'EOF'
        | QTDE | DESCRIÇÃO | VALOR |
        |--:|---|--:|
        | 1 | Bagel ovos | 39,00 |
        | 1 | Chá gelado | 18,00 |
        | 1 | Brownie | 22,00 |
        {style=receipt}
        EOF
      - "bobina check conferencia.bob.md"
    checks:
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" clean conferencia.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" bar-titles-ruled conferencia.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" bar-items conferencia.bob.md"}

  - id: table-market-58mm
    prompt: "Write cupom.bob.md: a supermarket receipt for the 58 mm printer, with the columns item, code, description, quantity, unit, unit price and total, and these items: 001 · 1431 · CEBOLA KG · 1.105 · kg · 12,90 · 14,25; 003 · 7369 · BANANA PRATA ORG · 1.635 · kg · 9,99 · 16,33; 008 · 7896016500213 · LENTILHA GRANFINO · 1 · un · 11,98 · 11,98. Each item must fit on one line, so smaller letters are fine. The code does not matter much: it may take two lines and little room; the description needs more room. Right after item 003, a line 'Desconto no item 3 - 3,27' that starts under the description and runs to the end of the line."
    ideal: 1
    solution:
      - |
        cat > cupom.bob.md <<'EOF'
        | IT {width=3ch} | CÓD {width=7ch} | DESCRIÇÃO | QTD {width=5ch} | UN {width=2ch} | UNIT {width=5ch} | TOTAL {width=5ch} |
        |---|---|---|--:|---|--:|--:|
        | 001 | 1431 | CEBOLA KG | 1.105 | kg | 12,90 | 14,25 |
        | 003 | 7369 | BANANA PRATA ORG | 1.635 | kg | 9,99 | 16,33 |
        | | | Desconto no item 3 - 3,27 {span=all} |
        | 008 | 7896016500213 | LENTILHA GRANFINO | 1 | un | 11,98 | 11,98 |
        {style=receipt font=Terminus size=16px}
        EOF
      - "bobina check cupom.bob.md"
    checks:
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" clean cupom.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" market-smaller-letters cupom.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" market-one-line-per-item cupom.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" market-code-narrow cupom.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" market-discount-under-description cupom.bob.md"}

  - id: table-price-prefix
    prompt: "Write precos.bob.md, a price list with the columns Produto, Preço and Promo: Arroz 5 kg 24,90 21,90; Feijão 1 kg 8,49 7,99; Café 500 g 18,90 16,50. 'R$ ' must print before every Preço and Promo value, but not in the titles nor before the product names. Type the values in the file without the R$: later they will come from a spreadsheet, so the R$ must come from how the table is set up."
    ideal: 1
    solution:
      - |
        cat > precos.bob.md <<'EOF'
        | Produto | Preço {prefix="R$ "} | Promo {prefix="R$ "} |
        |---|--:|--:|
        | Arroz 5 kg | 24,90 | 21,90 |
        | Feijão 1 kg | 8,49 | 7,99 |
        | Café 500 g | 18,90 | 16,50 |
        EOF
      - "bobina check precos.bob.md"
    checks:
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" clean precos.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" prices-prefixed precos.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" prices-not-before-names precos.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" prices-not-typed precos.bob.md"}

  - id: table-fix
    prompt: "A colleague wrote etiqueta.bob.md and complains: the R$ came out in front of the product names and the prices have none; the first table does not look like a receipt; and the discount line is squeezed into its column. Fix the file, keeping its name."
    ideal: 2  # one check that lists the problems, one that confirms the fix
    solution:
      - "bobina check etiqueta.bob.md"
      - "sed -i -e 's/Produto {prefix=\"R\\$ \"} | Preço | Promo/Produto | Preço {prefix=\"R$ \"} | Promo {prefix=\"R$ \"}/' -e 's/style=recibo/style=receipt/' -e 's/span=ALL/span=all/' etiqueta.bob.md"
      - "bobina check etiqueta.bob.md"
    checks:
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" clean etiqueta.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" fix-prices etiqueta.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" fix-receipt-look etiqueta.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" fix-discount-wider etiqueta.bob.md"}

  # Charts: the study tasks (a dashboard's supply line, a bakery's bars in reais with a goal, a chart from a CSV),
  # graded from what bobina check says it drew (C101).

  - id: table-chart-supply
    prompt: "Write painel.bob.md: a crypto dashboard shows a token's daily supply: Jan 27: 0 · Feb 15: 800 · Apr 1: 3,500 · Jun 1: 52,000 · Jul 1: 120,000 · Sep 1: 300,000 · Oct 1: 410,000 · Nov 17: 749,069. Print it as a line chart about 3 cm tall, with three values on the vertical axis, written along the axis so the drawing gets more of the paper's width."
    ideal: 1
    solution:
      - |
        cat > painel.bob.md <<'EOF'
        | day | supply |
        |---|---|
        | Jan 27 | 0 |
        | Feb 15 | 800 |
        | Apr 1 | 3500 |
        | Jun 1 | 52000 |
        | Jul 1 | 120000 |
        | Sep 1 | 300000 |
        | Oct 1 | 410000 |
        | Nov 17 | 749069 |
        {chart=line height=30mm y-ticks=3}
        EOF
      - "bobina check painel.bob.md"
    checks:
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" clean painel.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" supply-line painel.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" supply-three-values-along-the-axis painel.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" supply-about-3cm painel.bob.md"}

  - id: table-chart-bakery
    prompt: "Write padaria.bob.md: a bakery's sales this week, in Brazilian reais as the owner typed them: Seg R$ 1.240,50 · Ter R$ 980,00 · Qua R$ 1.105,25 · Qui R$ 1.320,00 · Sex R$ 1.890,75 · Sáb R$ 2.430,00 · Dom R$ 760,00. The daily goal is R$ 1.200,00 every day. Print bars of sales and goal side by side for each day, with a legend. Keep the amounts as typed."
    ideal: 1
    solution:
      - |
        cat > padaria.bob.md <<'EOF'
        ---
        locale: pt-BR
        ---
        | dia | vendas | meta |
        |---|---|---|
        | Seg | R$ 1.240,50 | R$ 1.200,00 |
        | Ter | R$ 980,00 | R$ 1.200,00 |
        | Qua | R$ 1.105,25 | R$ 1.200,00 |
        | Qui | R$ 1.320,00 | R$ 1.200,00 |
        | Sex | R$ 1.890,75 | R$ 1.200,00 |
        | Sáb | R$ 2.430,00 | R$ 1.200,00 |
        | Dom | R$ 760,00 | R$ 1.200,00 |
        {chart=bar}
        EOF
      - "bobina check padaria.bob.md"
    checks:
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" clean padaria.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" bakery-bars padaria.bob.md"}

  - id: table-chart-file
    prompt: "Write vendas.bob.md. The file vendas.csv (next to it) has the columns data, produto, valor, meta, with several rows per day. Print a bar chart of valor for each data, half the paper wide and centred, with thin dotted lines at each value on the vertical axis. Do not copy the numbers into the document: next week the file changes."
    ideal: 1
    solution:
      - |
        cat > vendas.bob.md <<'EOF'
        | data | valor |
        |---|---|
        {chart=bar data=vendas.csv width=half .center .grid}
        EOF
      - "bobina check vendas.bob.md"
    checks:
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" clean vendas.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" file-bars vendas.bob.md"}
      - {shell: "python3 \"$BOBINA_STATE_DIR/../table_checks.py\" file-half-centred-grid vendas.bob.md"}
