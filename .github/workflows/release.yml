# A version is a tag, published to PyPI by trusted publishing (no token) and installed on Linux, macOS and Windows.
# vX.Y.Z-rc.N is a pre-release (0.1.0rc1): pip and uv only install it when asked by version or with --pre, so
# nobody gets it by accident; it becomes a GitHub pre-release. vX.Y.Z is the release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.event.repository.private == false  # only the public repository releases
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version in pyproject.toml
        id: version
        run: |
          python -m pip install --quiet packaging  # not in the runner's Python
          tag="${GITHUB_REF_NAME#v}"
          want=$(python -c "from packaging.version import Version; print(Version('$tag'))")
          have=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          have=$(python -c "from packaging.version import Version; print(Version('$have'))")
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME is $want, pyproject.toml says $have"; exit 1; }
          echo "version=$want" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - name: Tests and personal-data scan
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          python -m pip install -e ".[dev]" build
          pytest -q
          python tools/leakscan.py
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  install-test:
    needs: [build, pypi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install this version from PyPI and run it
        shell: bash
        run: |
          # PyPI's index is cached by a CDN: a runner can miss a new upload for a few minutes (0.1.0: macOS did)
          for _ in $(seq 1 20); do
            python -m pip install --no-cache-dir "bobina==${{ needs.build.outputs.version }}" && break
            sleep 30
          done
          bobina --version
          bobina check "hello from the release check" --json

  deb:
    # bobina_X.Y.Z_amd64.deb and _arm64.deb (tools/build_deb.py): this run's wheel with its dependencies (wheels for
    # each Python 3.11+, downloaded, nothing compiled), run by the distribution's python3. The PyPI publish does not
    # wait for it, and a broken .deb only leaves it out of the GitHub release.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Build the .debs
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          for arch in amd64 arm64; do
            python tools/build_deb.py --arch "$arch" --wheel dist/bobina-*-py3-none-any.whl --out deb/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: deb/*.deb

  deb-test:
    # each .deb installed by apt in a clean container of each distribution, on its own architecture
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: ["debian:12", "debian:13", "ubuntu:24.04", "ubuntu:26.04"]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: deb/
      - name: apt install the .deb and run it
        run: contrib/deb/test-in-container.sh "${{ matrix.image }}" deb/bobina_*_${{ matrix.arch }}.deb

  homebrew:
    # This repository is the tap (brew tap rafaelbressan/bobina https://github.com/rafaelbressan/bobina). A release
    # (not a pre-release) commits Formula/bobina.rb with this version's sdist to main, its resources regenerated,
    # built from source and tested first; a failure commits nothing. brew builds third-party sdists, so the job's
    # token is only in the last step: never in the checkout's .git/config, the environment or the build.
    needs: [build, install-test]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: The formula for this version, built and tested
        run: |
          brew tap rafaelbressan/bobina "$GITHUB_WORKSPACE"  # a clone of this checkout, as users tap it from GitHub
          brew trust --tap rafaelbressan/bobina || true  # Homebrew 7 loads third-party taps only when trusted
          formula="$(brew --repository rafaelbressan/bobina)/Formula/bobina.rb"
          read -r url sha256 <<<"$(curl -fsSL "https://pypi.org/pypi/bobina/$VERSION/json" | python3 -c '
          import json, sys
          u = [u for u in json.load(sys.stdin)["urls"] if u["packagetype"] == "sdist"][0]
          print(u["url"], u["digests"]["sha256"])')"
          sed -i '' -E -e "s|^  url \".*\"|  url \"$url\"|" -e "s|^  sha256 \".*\"|  sha256 \"$sha256\"|" "$formula"
          # bobina itself was uploaded minutes ago; its dependencies keep Homebrew's release cooldown
          brew update-python-resources --ignore-main-package-cooldown --exclude-packages pillow rafaelbressan/bobina/bobina
          brew install --build-from-source rafaelbressan/bobina/bobina
          brew test rafaelbressan/bobina/bobina
          brew audit --strict rafaelbressan/bobina/bobina
          cp "$formula" Formula/bobina.rb
      - name: Commit it to main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add Formula/bobina.rb
          if git diff --cached --quiet; then echo "Formula/bobina.rb already has bobina $VERSION"; exit 0; fi
          bot() { git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" "$@"; }
          bot commit -m "Formula/bobina.rb: bobina $VERSION"
          # the token as a header for each push (git -c), never written to .git/config
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          push() { git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main; }
          push || { git fetch origin main && bot rebase origin/main && push; }  # main moved meanwhile: rebase once

  github-release:
    # with the .debs when they passed their test; without them (and a warning) when not: the release still happens
    needs: [build, pypi, install-test, deb-test]
    if: ${{ !cancelled() && needs.install-test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        if: needs.deb-test.result == 'success'
        with:
          name: deb
          path: dist/
      - name: Release with the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.build.outputs.version }}"
          base=$(python3 -c "import re,sys; print(re.sub(r'(a|b|rc)\d+$', '', sys.argv[1]))" "$v")  # 0.1.0rc1 -> 0.1.0
          awk -v v="$base" '$0 ~ "^## "v" " || $0 ~ "^## "v"$" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "bobina $v" > notes.md
          pre=""; [ "${{ needs.build.outputs.prerelease }}" = "true" ] && pre="--prerelease"
          [ "${{ needs.deb-test.result }}" = "success" ] || echo "::warning::no .deb in this release: deb-test did not pass"
          gh release create "$GITHUB_REF_NAME" dist/* --title "bobina $v" --notes-file notes.md $pre
