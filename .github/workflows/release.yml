# A version is a tag, published to PyPI by trusted publishing (no token) and installed on Linux, macOS and Windows.
# vX.Y.Z-rc.N is a pre-release (0.1.0rc1): pip and uv only install it when asked by version or with --pre, so
# nobody gets it by accident; it becomes a GitHub pre-release. vX.Y.Z is the release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.event.repository.private == false  # only the public repository releases
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version in pyproject.toml
        id: version
        run: |
          python -m pip install --quiet packaging  # not in the runner's Python
          tag="${GITHUB_REF_NAME#v}"
          want=$(python -c "from packaging.version import Version; print(Version('$tag'))")
          have=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          have=$(python -c "from packaging.version import Version; print(Version('$have'))")
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME is $want, pyproject.toml says $have"; exit 1; }
          echo "version=$want" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - name: Tests and personal-data scan
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          python -m pip install -e ".[dev]" build
          pytest -q
          python tools/leakscan.py
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  install-test:
    needs: [build, pypi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install this version from PyPI and run it
        shell: bash
        run: |
          # PyPI's index is cached by a CDN: a runner can miss a new upload for a few minutes (0.1.0: macOS did)
          for i in $(seq 1 20); do
            python -m pip install --no-cache-dir "bobina==${{ needs.build.outputs.version }}" && break
            sleep 30
          done
          bobina --version
          bobina check "hello from the release check" --json

  homebrew:
    # A release (not a pre-release) bumps Formula/bobina.rb in rafaelbressan/homebrew-tap: contrib/homebrew/bobina.rb
    # with this version's sdist, its resources regenerated, built from source and tested before the push. Off until
    # the HOMEBREW_TAP_TOKEN secret exists (contrib/homebrew/README.md). A failure here pushes nothing.
    # The token is only in the first and last steps: brew builds third-party sdists in between, so it is never in
    # the job's environment, a clone URL or .git/config.
    needs: [build, install-test]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Off without the HOMEBREW_TAP_TOKEN secret
        id: on
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::no HOMEBREW_TAP_TOKEN secret: the Homebrew tap was not bumped"; fi
      - uses: actions/checkout@v4
        if: steps.on.outputs.on == 'true'
        with:
          persist-credentials: false
      - name: The formula for this version, built and tested
        if: steps.on.outputs.on == 'true'
        run: |
          tap="$(brew --repository)/Library/Taps/rafaelbressan/homebrew-tap"
          git clone https://github.com/rafaelbressan/homebrew-tap.git "$tap"  # public: no credentials
          brew trust --tap rafaelbressan/tap || true  # Homebrew 7 loads third-party taps only when trusted
          sdist=$(curl -fsSL "https://pypi.org/pypi/bobina/$VERSION/json" | python3 -c '
          import json, sys
          u = [u for u in json.load(sys.stdin)["urls"] if u["packagetype"] == "sdist"][0]
          print(u["url"], u["digests"]["sha256"])')
          set -- $sdist
          mkdir -p "$tap/Formula"
          sed -E -e "s|^  url \".*\"|  url \"$1\"|" -e "s|^  sha256 \".*\"|  sha256 \"$2\"|" \
            contrib/homebrew/bobina.rb > "$tap/Formula/bobina.rb"
          # bobina itself was uploaded minutes ago; its dependencies keep Homebrew's release cooldown
          brew update-python-resources --ignore-main-package-cooldown --exclude-packages pillow rafaelbressan/tap/bobina
          brew install --build-from-source rafaelbressan/tap/bobina
          brew test rafaelbressan/tap/bobina
          brew audit --strict rafaelbressan/tap/bobina
      - name: Push to the tap
        if: steps.on.outputs.on == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd "$(brew --repository)/Library/Taps/rafaelbressan/homebrew-tap"
          git add Formula/bobina.rb
          if git diff --cached --quiet; then echo "the tap already has bobina $VERSION"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "bobina $VERSION"
          # the token as a header for this one command (git -c), never written to .git/config
          auth=$(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD

  github-release:
    needs: [build, pypi, install-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release with the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.build.outputs.version }}"
          base=$(python3 -c "import re,sys; print(re.sub(r'(a|b|rc)\d+$', '', sys.argv[1]))" "$v")  # 0.1.0rc1 -> 0.1.0
          awk -v v="$base" '$0 ~ "^## "v" " || $0 ~ "^## "v"$" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "bobina $v" > notes.md
          pre=""; [ "${{ needs.build.outputs.prerelease }}" = "true" ] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --title "bobina $v" --notes-file notes.md $pre
