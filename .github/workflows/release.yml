# A version is a tag. vX.Y.Z-rc.N goes to TestPyPI and is installed on Linux, macOS and Windows; vX.Y.Z goes to
# PyPI and becomes a GitHub release. PyPI and TestPyPI trust this workflow (trusted publishing): no token.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.event.repository.private == false  # only the public repository releases
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version in pyproject.toml
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          want=$(python -c "from packaging.version import Version; print(Version('$tag'))")
          have=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          have=$(python -c "from packaging.version import Version; print(Version('$have'))")
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME is $want, pyproject.toml says $have"; exit 1; }
          echo "version=$want" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - name: Tests and personal-data scan
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          python -m pip install -e ".[dev]" build
          pytest -q
          python tools/leakscan.py
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  install-test:
    needs: [build, testpypi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from TestPyPI (dependencies from PyPI) and run
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ \
              "bobina==${{ needs.build.outputs.version }}" && break
            sleep 20  # the index takes a moment to show a new upload
          done
          bobina --version
          bobina check "hello from the release check" --json

  pypi:
    needs: build
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release with the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.build.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## "v" " || $0 ~ "^## "v"$" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "bobina $v" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "bobina $v" --notes-file notes.md
