# Formula/bobina.rb for a version already on PyPI. release.yml calls it on each release; when that job failed, run
# it by hand: gh workflow run homebrew.yml -f version=X.Y.Z
name: homebrew

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "a version on PyPI, e.g. 0.1.1"
        type: string
        required: true

permissions:
  contents: read

jobs:
  formula:
    # This repository is the tap (brew tap rafaelbressan/bobina https://github.com/rafaelbressan/bobina). A release
    # (not a pre-release) points Formula/bobina.rb at this version's sdist, regenerates its resources, builds it from
    # source and tests it. brew builds third-party sdists here, so this job can only read the repository: the
    # formula leaves as an artifact, and push commits it.
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: A version number
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]] || { echo "not a release version: $VERSION"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: The formula for this version, built and tested
        run: |
          brew tap rafaelbressan/bobina "$GITHUB_WORKSPACE"  # a clone of this checkout, as users tap it from GitHub
          brew trust --tap rafaelbressan/bobina || true  # Homebrew 7 loads third-party taps only when trusted
          formula="$(brew --repository rafaelbressan/bobina)/Formula/bobina.rb"
          read -r url sha256 <<<"$(curl -fsSL "https://pypi.org/pypi/bobina/$VERSION/json" | python3 -c '
          import json, sys
          u = [u for u in json.load(sys.stdin)["urls"] if u["packagetype"] == "sdist"][0]
          print(u["url"], u["digests"]["sha256"])')"
          sed -i '' -E -e "s|^  url \".*\"|  url \"$url\"|" -e "s|^  sha256 \".*\"|  sha256 \"$sha256\"|" "$formula"
          # bobina itself was uploaded minutes ago; its dependencies keep Homebrew's release cooldown
          brew update-python-resources --ignore-main-package-cooldown --exclude-packages pillow rafaelbressan/bobina/bobina
          brew install --build-from-source rafaelbressan/bobina/bobina
          brew test rafaelbressan/bobina/bobina
          brew audit --strict rafaelbressan/bobina/bobina
          mkdir "$RUNNER_TEMP/tested" && cp "$formula" "$RUNNER_TEMP/tested/bobina.rb"  # not ./formula: macOS reads it as Formula/
      - uses: actions/upload-artifact@v4
        with:
          name: formula
          path: ${{ runner.temp }}/tested/bobina.rb

  push:
    # commits the tested formula to main: a fresh checkout, nothing built; the only Homebrew job that can write
    needs: [formula]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: ${{ runner.temp }}/tested
      - name: Personal-data scan (a push with this job's token runs no workflow, so ci.yml does not scan it)
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          cp "$RUNNER_TEMP/tested/bobina.rb" Formula/bobina.rb
          python3 tools/leakscan.py Formula/bobina.rb
      - name: Commit it to main
        run: |
          if git diff --quiet -- Formula/bobina.rb; then echo "Formula/bobina.rb already has bobina $VERSION"; exit 0; fi
          bot() { git -c core.hooksPath=/dev/null -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" "$@"; }
          bot commit -m "Formula/bobina.rb: bobina $VERSION" -- Formula/bobina.rb
          git push origin HEAD:main || { git fetch origin main && bot rebase origin/main && git push origin HEAD:main; }  # once
